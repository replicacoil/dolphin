name: Sync upstream and build libretro core (Windows x64)

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 1 * *'    # check upstream once a month, at 00:00 UTC on the 1st
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # the sync job pushes merge commits back to this fork

jobs:
  sync-upstream:
    # Only needed on a schedule/manual run. A push already contains your latest
    # commit, so there's nothing to sync in that case.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0   # full history so the merge has a common ancestor to work from

      - name: Merge upstream/master into this fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/libretro/dolphin.git
          git fetch upstream master
          git merge upstream/master --no-edit
          git push origin HEAD:master

  build-windows:
    needs: sync-upstream
    # Run whether sync-upstream succeeded (schedule/manual) or was skipped (push).
    # Do NOT run if it actually failed (e.g. merge conflict) - that needs your attention first.
    if: always() && (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    runs-on: ubuntu-latest
    container: ubuntu:25.10   # matches dolphin-emu's own build-windows-ming-libretro.yml
    steps:
      - name: Install cross-compile toolchain
        run: |
          apt update
          apt install -y git cmake ninja-build pkg-config mingw-w64

      - name: Check out fork (post-sync)
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Configure (MinGW cross-compile)
        run: |
          export PKG_CONFIG_LIBDIR=/usr/x86_64-w64-mingw32/lib/pkgconfig
          export PKG_CONFIG_PATH=/usr/x86_64-w64-mingw32/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/usr/x86_64-w64-mingw32
          mkdir -p build && cd build
          cmake .. \
            -DLIBRETRO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -G Ninja

      - name: Build
        run: |
          cd build
          ninja -j$(nproc)

      - name: Locate build output
        if: always()
        run: find . -iname "dolphin_libretro.dll" -o -iname "dolphin_libretro.dll.a"

      - name: Upload dolphin_libretro.dll
        uses: actions/upload-artifact@v4
        with:
          name: dolphin_libretro-windows-x64
          path: build/Binaries/dolphin_libretro.dll
          if-no-files-found: error
